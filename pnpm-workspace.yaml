# yarn-classic-style flat node_modules: external deps are hoisted to the workspace-root node_modules so
# every workspace package can resolve them without re-declaring. This lets shared runtime deps (react,
# react-bootstrap, express, …) be declared ONCE in @altea/altea and be resolvable from altea-auth,
# eastwind, and future modules — matching the single-node_modules model the Signum client used under
# yarn+vite. (Trades away pnpm's phantom-dependency strictness, as yarn did.) Changing this recreates
# node_modules on the next `pnpm install`.
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  unrs-resolver: true
# The root package.json was removed on the test-tiers refactor, so shared build tooling /
# type packages are declared inside workspace packages instead:
#   @types/node -> altea/altea (+ altea/quote-transformer-test)
#   typescript, ts-patch (tspc) -> altea/quote-transformer
# Public-hoist them to the workspace-root node_modules so every package can resolve
# `types: ["node"]` and find the `tspc` binary on PATH — reproducing what the old root
# package.json used to hoist. (pnpm 11 reads these settings here, not from .npmrc.)
publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
  - '@types/node'
  - 'typescript'
  - 'ts-patch'
