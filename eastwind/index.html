<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eastwind</title>
    <!-- Apply the stored theme BEFORE anything paints, so neither the splash below nor the app itself
         comes up light and then flips. The key is @altea/altea's ThemeModeSelector's own (it persists the
         SELECTED mode, "auto" included), and the attribute is the one bootstrap 5.3 reads. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("bootstrap-theme-mode") || "auto";
          var dark = mode === "dark" ||
            (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.bsTheme = dark ? "dark" : "light";
        } catch (e) {
          /* a locked-down browser can throw on localStorage; the CSS below still has its own fallbacks */
        }
      })();
    </script>
    <!-- Pre-React loading indicator. Inline on purpose (no external css/js/font/image): the bundle is
         ~MBs of transformer-emitted client + bootstrap, and until `createRoot(...).render()` runs there
         is nothing on screen at all. Anything this splash needed from the network could arrive after
         the app it is covering for. -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.75rem;
        background: #fff;
        color: #212529;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        /* Delayed fade-in: a warm cache boots fast enough that showing this immediately would be a flash. */
        animation: app-splash-in 0.25s ease 0.15s both;
      }

      #app-splash.is-leaving {
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      /* The ring: one full circle as the track, one arc on top of it, spinning. */
      #app-splash .splash-ring {
        width: 54px;
        height: 54px;
        border: 4px solid rgba(13, 110, 253, 0.18);
        border-top-color: #0d6efd;
        border-radius: 50%;
        animation: app-splash-spin 0.8s linear infinite;
      }

      #app-splash .splash-brand {
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 0.22em;
        /* letter-spacing also trails the LAST glyph, so the flex-centred box sits half a step right of
           where the letters read as centred. */
        margin-right: -0.22em;
        text-transform: uppercase;
        animation: app-splash-pulse 1.8s ease-in-out infinite;
      }

      #app-splash .splash-hint {
        position: absolute;
        bottom: 2.5rem;
        font-size: 0.8125rem;
        opacity: 0;
        color: #6c757d;
      }

      /* Shown only if the bundle is unusually slow, so a blank-looking wait says something. */
      #app-splash.is-slow .splash-hint {
        opacity: 1;
        transition: opacity 0.4s ease;
      }

      @keyframes app-splash-in   { from { opacity: 0 } to { opacity: 1 } }
      @keyframes app-splash-spin { to   { transform: rotate(360deg) } }
      @keyframes app-splash-pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.45 } }

      /* Dark: the explicit bootstrap attribute wins, and the OS preference is honoured otherwise. */
      @media (prefers-color-scheme: dark) {
        html:not([data-bs-theme="light"]) #app-splash { background: #212529; color: #dee2e6 }
        html:not([data-bs-theme="light"]) #app-splash .splash-hint { color: #adb5bd }
      }

      html[data-bs-theme="dark"] #app-splash { background: #212529; color: #dee2e6 }
      html[data-bs-theme="dark"] #app-splash .splash-hint { color: #adb5bd }

      @media (prefers-reduced-motion: reduce) {
        #app-splash,
        #app-splash .splash-ring,
        #app-splash .splash-brand { animation-duration: 0.01ms; animation-iteration-count: 1 }
        /* Without a spin, the ring alone reads as a static graphic — fade the whole circle instead. */
        #app-splash .splash-ring {
          border-color: rgba(13, 110, 253, 0.35);
          border-top-color: #0d6efd;
          animation: app-splash-pulse 1.8s ease-in-out infinite;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Loading eastwind">
      <div class="splash-ring"></div>
      <div class="splash-brand">eastwind</div>
      <div class="splash-hint">Still loading&hellip;</div>
    </div>
    <div id="root"></div>
    <!-- Globals Signum injects via Index.cshtml; the ajax layer (toAbsoluteUrl) needs __baseName. -->
    <script>
      window.__baseName = "";
      window.__serverName = "";
    </script>
    <!-- Take the splash down when React's first commit lands. MainPublic's `reload()` awaits autoLogin
         and the metadata blob BEFORE `createRoot(el).render(...)`, so "the bundle finished executing"
         is far too early — the first content appearing under #root is the real signal. -->
    <script>
      (function () {
        var splash = document.getElementById("app-splash");
        var root = document.getElementById("root");
        if (!splash || !root) return;

        var slowTimer = setTimeout(function () { splash.classList.add("is-slow"); }, 8000);

        function hide() {
          clearTimeout(slowTimer);
          if (observer) observer.disconnect();
          splash.classList.add("is-leaving");
          // Drop it from the DOM rather than leaving an invisible fixed overlay over the app.
          setTimeout(function () { splash.remove(); }, 350);
        }

        // ANY node counts, not only an ELEMENT. The splash is fixed, opaque and z-index 2000, so whatever
        // it does not come down for is invisible: while this waited for an element, a boot that failed and
        // wrote its message as a TEXT node (an unreachable /api at startup, say) showed a spinner that
        // never stopped, with the real error hidden underneath it.
        var observer = new MutationObserver(function () {
          if (root.childNodes.length === 0) return;
          hide();
        });
        observer.observe(root, { childList: true });

        // The deterministic escape hatch, for a bootstrap that fails before it renders anything at all
        // (MainPublic's boot().catch calls it).
        window.__hideAppSplash = hide;

        // Whatever ran before this script may already have mounted (module scripts are deferred, so it
        // normally has not — but a cached bundle plus a synchronous render is not worth losing to a race).
        if (root.childNodes.length > 0) hide();
      })();
    </script>
    <!-- The transformer-emitted client (tspc -b [--watch]); Vite bundles the dist output, it does NOT
         run the quote-transformer, so quoted lambdas (token(a=>…)) must come pre-transformed from dist. -->
    <script type="module" src="/dist/main.client.js"></script>
  </body>
</html>
