<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eastwind</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Globals Signum injects via Index.cshtml; the ajax layer (toAbsoluteUrl) needs __baseName. -->
    <script>
      window.__baseName = "";
      window.__serverName = "";
    </script>
    <!-- The transformer-emitted client (tspc -b [--watch]); Vite bundles the dist output, it does NOT
         run the quote-transformer, so quoted lambdas (token(a=>…)) must come pre-transformed from dist. -->
    <script type="module" src="/dist/client/main.js"></script>
  </body>
</html>
